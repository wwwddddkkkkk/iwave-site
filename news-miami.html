<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IWAVE at Miami International Boat Show | iwave Journal</title>
<meta name="description" content="IWAVE made waves at the Miami International Boat Show with the world's first electric water go-kart.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles/shared.css">
<style>
  html,body{margin:0;padding:0;background:#fff;font-family:'Manrope',system-ui,sans-serif;color:#0E0E0C}
  .iw-article h2{font-family:'Manrope',sans-serif;font-weight:200;letter-spacing:-0.02em;font-size:30px;line-height:1.2;margin:56px 0 16px;color:var(--ink)}
  .iw-article p{margin:0 0 20px;font-size:17px;line-height:1.75;color:var(--ink-2)}
  .iw-article ul{padding-left:0;list-style:none;margin:8px 0 24px}
  .iw-article ul li{padding:18px 0;border-top:1px solid var(--hairline);font-size:15px;line-height:1.6;color:var(--ink-2);display:flex;gap:18px;align-items:flex-start}
  .iw-article ul li:last-child{border-bottom:1px solid var(--hairline)}
  .iw-article ul li .iw-num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--warm-grey);min-width:32px;padding-top:3px}
  .iw-article ul li .iw-body{flex:1}
  .iw-article ul li strong{color:var(--ink);font-weight:500;display:block;margin-bottom:2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared/Layout.jsx"></script>
<script type="text/babel" src="shared/News.jsx"></script>
<script type="text/babel">
  function Body() {
    const highlights = [
      { n: '01', t: 'Intuitive "hop in & go" design', d: 'No license required, just press the foot throttle and experience pure fun.' },
      { n: '02', t: 'Zero emissions',                 d: 'Advanced electric drive system. No engine noise. No fumes. An eco-friendly ride.' },
      { n: '03', t: 'Drift & race on water',          d: 'Speeds up to 50 km/h (31 mph), precision steering, and agile handling — the thrill of racing, on the sea.' },
      { n: '04', t: 'Modular & customizable',         d: 'Built for private and commercial markets. Options for branding and easy fleet management.' },
    ];
    return (
      <React.Fragment>
        <p>IWAVE made a splash at this year's Miami International Boat Show — one of the world's premier showcases for innovation in marine and luxury watercraft.</p>
        <p>For our first public appearance in the U.S. market, we brought the IWAVE Wavekart S — the world's first electric water go-kart — to Miami's iconic waters. The response? Overwhelming excitement, smiles, and a steady stream of inquiries from luxury resort operators, yacht owners, and watersports enthusiasts.</p>

        <h2>What makes the IWAVE Wavekart stand out</h2>
        <ul>
          {highlights.map(h => (
            <li key={h.n}>
              <div className="iw-num">{h.n}</div>
              <div className="iw-body">
                <strong>{h.t}</strong>
                {h.d}
              </div>
            </li>
          ))}
        </ul>

        <p>Throughout the five-day event we met with a wide range of partners — from top U.S. and European dealers to luxury hotel groups and adventure fleet operators. Test rides drew a diverse audience: families seeking new ways to enjoy the water, adventure lovers looking for the next big thrill, and marina managers exploring premium new offerings for their clients.</p>

        <h2>What's next</h2>
        <p>Following the show, IWAVE is expanding its dealer network in Florida and the U.S. East Coast, preparing for resort and private fleet deliveries this summer, and working on next-generation product development.</p>
        <p>Thank you to everyone who visited us — your enthusiasm and ideas inspire us to keep pushing the boundaries of what's possible on water.</p>
        <p>Stay tuned for more updates as IWAVE rides the next wave of innovation. To talk fleet or test rides, reach out at <strong>info@iwavekart.com</strong>.</p>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Article slug="miami-boat-show"><Body/></Article>
  );
</script>
</body>
</html>
