<script type="text/babel">
  function Body() {
    return (
      <React.Fragment>
        <p>Today we're thrilled to announce the global launch of IWAVE's first product: the <strong>Wavekart S</strong> — the world's first electric water go-kart.</p>
        <p>With this launch we aren't just introducing a new product; we're creating a new way to experience the water.</p>

        <h2>A new category: water go-kart</h2>
        <p>The vision behind IWAVE is simple — reimagine the future of watersports.</p>
        <p>Jet skis have dominated the market for decades, but they come with limits: noise, fuel, safety concerns, and licensing requirements. We believed there was a better way.</p>
        <blockquote>Wavekart S is our answer. An intuitive, fully electric watercraft that brings the thrill of go-karting to the water.</blockquote>
        <p>Designed for riders of all ages and skill levels, it combines effortless control with high performance and luxury design.</p>

        <h2>Our mission — redefining watersports for the next generation</h2>
        <p>At IWAVE we believe the future of watersports must be:</p>
        <ul>
          <li><strong>Electric & sustainable</strong> — our oceans deserve it.</li>
          <li><strong>Safe & accessible</strong> — for everyone, from first-timers to experienced riders.</li>
          <li><strong>Fun & stylish</strong> — a true luxury toy, built to delight.</li>
          <li><strong>Community-driven</strong> — built and improved together with our riders.</li>
        </ul>

        <h2>What's next</h2>
        <p>We're expanding our dealer network in the U.S. and Europe, with first resort and private deliveries shipping this summer. The Wavekart X — our Family Edition — follows, designed for fleets and shared shorelines.</p>
        <p>If you'd like to be among the first to ride, reach out at <strong>info@iwavekart.com</strong>.</p>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Article slug="launch-wavekart-s"><Body/></Article>
