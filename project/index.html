<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iwave Wavekart — Luxury Site Concepts</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="styles/shared.css">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Manrope', system-ui, sans-serif; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="directions/Ivory.jsx"></script>
<script type="text/babel" src="directions/Obsidian.jsx"></script>
<script type="text/babel" src="directions/Editorial.jsx"></script>
<script type="text/babel" src="directions/ObsidianLight.jsx"></script>

<script type="text/babel">
  // Sites are rendered inside fixed-size frames (1440 design width)
  // so the layouts feel like real desktop sites at their proper scale.
  const SiteFrame = ({ children }) => (
    <div style={{ width: 1440, height: 1800, overflow: 'hidden', background: '#fff', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.05)' }}>
      {children}
    </div>
  );

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="luxury-directions"
          title="iwave Wavekart — Three Luxury Directions"
          subtitle="Monochrome editorial · Quiet luxury · Apple/DJI-inspired tech-luxury · Each is a full single-page site with the model toggle, color picker, and animated specs counter wired up. Click expand on any artboard to view fullscreen."
        >
          <DCArtboard id="ivory" label="01 · Ivory — Hermès quiet luxury" width={1440} height={1800}>
            <SiteFrame><IvorySite/></SiteFrame>
          </DCArtboard>
          <DCArtboard id="obsidian-light" label="02b · Obsidian Light — refined: ivory ground, ink accents, ocean video hero" width={1440} height={1800}>
            <SiteFrame><ObsidianLightSite/></SiteFrame>
          </DCArtboard>
          <DCArtboard id="obsidian" label="02 · Obsidian — original dark" width={1440} height={1800}>
            <SiteFrame><ObsidianSite/></SiteFrame>
          </DCArtboard>
          <DCArtboard id="editorial" label="03 · Editorial — Magazine quarterly" width={1440} height={1800}>
            <SiteFrame><EditorialSite/></SiteFrame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
